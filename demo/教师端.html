<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>多模态课堂互动 · 教师端</title>
<style>
  :root {
    --accent: #3d5afe;
    --accent-ink: #2f47d6;
    --accent-soft: #eef1ff;
    --accent-line: #cdd6ff;
    --ink: #12161f;
    --ink-2: #414a5e;
    --muted: #737d92;
    --line: #e6eaf2;
    --line-2: #d5dbe8;
    --surface: #fff;
    --surface-2: #f7f8fc;
    --bg: #f4f6fb;
    --ok: #12a150;
    --danger: #d93a3a;
    --r-sm: 10px;
    --r: 14px;
    --r-lg: 18px;
    --shadow-sm: 0 1px 2px rgba(18, 22, 31, .05);
    --shadow: 0 1px 2px rgba(18, 22, 31, .04), 0 8px 24px rgba(18, 22, 31, .05);
    --nav-h: 62px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 22px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------------------------------------------------------------- 顶栏 */
  .top {
    position: sticky; top: 0; z-index: 30; height: var(--nav-h);
    background: rgba(255, 255, 255, .9);
    backdrop-filter: saturate(180%) blur(14px);
    -webkit-backdrop-filter: saturate(180%) blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .top .wrap { display: flex; align-items: center; gap: 12px; height: var(--nav-h); }
  .logo {
    width: 30px; height: 30px; border-radius: 10px; flex: none;
    background: linear-gradient(150deg, #6a83ff, var(--accent));
    color: #fff; font-weight: 800; font-size: 16px;
    display: grid; place-items: center; box-shadow: 0 3px 10px rgba(61, 90, 254, .3);
  }
  .title { min-width: 0; font-weight: 700; font-size: 15px; letter-spacing: -.01em; }
  .title > span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .title small {
    display: block; font-weight: 400; color: var(--muted); font-size: 12px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tools { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: none; }
  .mini {
    font: inherit; font-size: 13px; font-weight: 500; padding: 8px 14px;
    border-radius: var(--r-sm); border: 1px solid var(--line-2); background: #fff;
    cursor: pointer; color: var(--ink-2); white-space: nowrap; min-height: 36px;
    transition: border-color .15s, color .15s, background .15s, box-shadow .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .mini:hover { border-color: var(--accent); color: var(--accent-ink); }
  .mini:active { background: var(--accent-soft); }
  .mini.on {
    background: var(--accent); border-color: var(--accent); color: #fff;
    box-shadow: 0 4px 12px rgba(61, 90, 254, .24);
  }
  .mini[disabled] { opacity: .6; cursor: default; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--ok);
    flex: none; box-shadow: 0 0 0 0 rgba(18, 161, 80, .5);
  }
  .dot.stale { background: #cbd2e0; }
  .dot.pulse { animation: pulse 1s ease-out 1; }
  @keyframes pulse {
    from { box-shadow: 0 0 0 0 rgba(18, 161, 80, .45); }
    to { box-shadow: 0 0 0 9px rgba(18, 161, 80, 0); }
  }

  /* -------------------------------------------------------------- 概览 */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 18px 0 10px; }
  .stat {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
    padding: 15px 17px; box-shadow: var(--shadow);
  }
  .stat .k { font-size: 12.5px; color: var(--muted); margin-bottom: 2px; }
  .stat .v {
    font-size: 26px; font-weight: 700; letter-spacing: -.02em;
    font-variant-numeric: tabular-nums; line-height: 1.25;
  }
  .stat .v small { font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 3px; }

  .cols { display: grid; grid-template-columns: 1.12fr 1fr; gap: 14px; margin: 12px 0; }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
    padding: 17px 19px 19px; box-shadow: var(--shadow); margin-bottom: 14px;
    min-width: 0;
  }
  .card h2 {
    margin: 0 0 15px; font-size: 15px; letter-spacing: -.012em;
    display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap;
  }
  .card h2 span { color: var(--muted); font-weight: 400; font-size: 12.5px; }
  .empty { color: var(--muted); font-size: 13.5px; }

  .barrow { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 13.5px; }
  .barrow:last-child { margin-bottom: 0; }
  .barrow .lb {
    width: 112px; flex: none; color: var(--ink-2);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .barrow .track { flex: 1; min-width: 40px; height: 10px; border-radius: 99px; background: #eef0f7; overflow: hidden; }
  .barrow .track i {
    display: block; height: 100%; border-radius: 99px;
    background: linear-gradient(90deg, #6a83ff, var(--accent));
    transition: width .45s cubic-bezier(.22, 1, .36, 1);
  }
  .barrow .n {
    width: 82px; flex: none; text-align: right; color: var(--muted);
    font-variant-numeric: tabular-nums; font-size: 12.5px;
  }

  .scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; max-width: 100%; }
  table.mini-t { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 420px; }
  table.mini-t th, table.mini-t td {
    text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  table.mini-t th { color: var(--muted); font-weight: 600; font-size: 12.5px; }
  table.mini-t tbody tr:last-child td { border-bottom: 0; }
  table.mini-t td.num { font-variant-numeric: tabular-nums; color: var(--ink-2); }

  /* ------------------------------------------------------------ 提交卡 */
  .subs { display: grid; gap: 12px; }
  .sub {
    border: 1px solid var(--line); border-radius: var(--r); background: var(--surface);
    overflow: hidden; box-shadow: var(--shadow-sm); transition: box-shadow .15s, border-color .15s;
  }
  .sub:hover { border-color: var(--line-2); }
  .sub.open { box-shadow: var(--shadow); }
  .sub > header {
    display: flex; align-items: center; gap: 12px; padding: 14px 18px;
    cursor: pointer; border-bottom: 1px solid transparent; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .sub > header:hover { background: var(--surface-2); }
  .sub.open > header { border-bottom-color: var(--line); background: var(--surface-2); }
  .caret {
    width: 18px; flex: none; color: var(--muted); font-size: 11px;
    transition: transform .18s; transform: rotate(-90deg);
  }
  .sub.open .caret { transform: rotate(0deg); }
  .who { font-weight: 700; font-size: 14.5px; flex: none; }
  .meta { color: var(--muted); font-size: 12.5px; display: flex; gap: 6px; flex-wrap: wrap; min-width: 0; }
  .badges { margin-left: auto; display: flex; gap: 7px; align-items: center; flex: none; }
  .badge {
    font-size: 12px; padding: 3px 10px; border-radius: 99px;
    background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; white-space: nowrap;
  }
  .badge.gray { background: #f0f2f8; color: var(--muted); }

  .sub > .body { display: none; padding: 16px 18px 18px; }
  .sub.open > .body { display: block; animation: rise .18s ease-out 1; }
  @keyframes rise { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; } }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px; margin-bottom: 14px; }
  .kv {
    display: flex; gap: 10px; font-size: 13.5px; padding: 7px 0;
    border-bottom: 1px dashed var(--line);
  }
  .kv .k { color: var(--muted); width: 100px; flex: none; }
  .kv .v { flex: 1; min-width: 0; word-break: break-word; }

  .media { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start; margin-top: 4px; }
  .media figure { margin: 0; }
  .media img {
    width: 124px; height: 124px; object-fit: cover; border-radius: 12px;
    border: 1px solid var(--line); display: block; background: #fff;
    cursor: zoom-in; transition: transform .13s, border-color .13s;
    -webkit-tap-highlight-color: transparent;
  }
  .media img:hover { transform: scale(1.02); border-color: var(--accent-line); }
  .media figcaption { font-size: 11.5px; color: var(--muted); margin-top: 5px; max-width: 124px; }
  .attachline { display: flex; gap: 8px; align-items: center; font-size: 13px; margin-top: 6px; }
  .attachline a { color: var(--accent-ink); text-decoration: none; }
  .attachline a:hover { text-decoration: underline; }
  audio { width: 100%; max-width: 330px; height: 40px; }

  details.raw { margin-top: 14px; }
  details.raw > summary {
    cursor: pointer; font-size: 13px; color: var(--accent-ink);
    font-weight: 500; list-style: none; display: inline-flex; align-items: center; gap: 6px;
  }
  details.raw > summary::-webkit-details-marker { display: none; }
  details.raw > summary::before { content: "▸"; font-size: 10px; transition: transform .15s; }
  details.raw[open] > summary::before { transform: rotate(90deg); }
  pre.json {
    margin: 10px 0 0; background: #141826; color: #d5ddf0; padding: 14px 15px;
    border-radius: 11px; font-size: 12px; line-height: 1.65; overflow: auto;
    max-height: 340px; -webkit-overflow-scrolling: touch;
    font-family: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, Menlo, monospace;
  }
  .state {
    padding: 26px 22px; border-radius: var(--r); background: #fff;
    border: 1px solid var(--line); color: var(--muted); text-align: center; font-size: 13.5px;
  }
  .state.err { border-color: #f2c9c9; background: #fdf4f4; color: #b72828; }
  .skeleton { display: grid; gap: 10px; }
  .sk {
    height: 62px; border-radius: var(--r); background:
      linear-gradient(90deg, #eef0f6 25%, #f6f7fb 37%, #eef0f6 63%);
    background-size: 400% 100%; animation: shimmer 1.3s ease-in-out infinite;
  }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
  .foot { color: var(--muted); font-size: 12.5px; text-align: center; margin: 24px 0 48px; }
  .foot code { background: #eceff6; padding: 2px 7px; border-radius: 6px; word-break: break-all; }

  /* ---------------------------------------------------------- 图片浮层 */
  .lightbox {
    position: fixed; inset: 0; z-index: 60; display: grid; place-items: center;
    padding: 30px 20px 54px; background: rgba(11, 15, 25, .88);
    animation: fade .16s ease-out 1;
  }
  .lightbox[hidden] { display: none; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .lightbox img {
    max-width: min(94vw, 1400px); max-height: calc(100vh - 104px);
    border-radius: 12px; background: #fff; box-shadow: 0 24px 60px rgba(0, 0, 0, .5);
  }
  .lightbox-close {
    position: fixed; top: calc(16px + env(safe-area-inset-top)); right: 18px;
    width: 42px; height: 42px; border-radius: 50%; padding: 0;
    display: grid; place-items: center; font-size: 17px; line-height: 1;
    color: #fff; cursor: pointer; background: rgba(255, 255, 255, .16); border: 0;
  }
  .lightbox-close:hover { background: rgba(255, 255, 255, .3); }
  .lightbox-hint {
    position: fixed; left: 0; right: 0; bottom: calc(16px + env(safe-area-inset-bottom));
    text-align: center; color: rgba(255, 255, 255, .58); font-size: 12px; pointer-events: none;
  }

  /* -------------------------------------------------------------- 窄屏 */
  @media (max-width: 900px) {
    .wrap { padding: 0 16px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .cols { grid-template-columns: 1fr; }
    .grid2 { grid-template-columns: 1fr; gap: 0; }
  }
  @media (max-width: 640px) {
    :root { --nav-h: auto; }
    .wrap { padding: 0 12px; }
    .top { height: auto; }
    .top .wrap {
      height: auto; flex-wrap: wrap; row-gap: 9px;
      padding-top: 10px; padding-bottom: 10px;
    }
    .title small { display: none; }
    .title > span { font-size: 14.5px; }
    .tools {
      order: 3; flex: 1 1 100%; min-width: 0; margin-left: 0;
      gap: 6px; overflow-x: auto; scrollbar-width: none;
      padding-bottom: 2px;
    }
    .tools::-webkit-scrollbar { display: none; }
    .mini { padding: 8px 12px; font-size: 12.5px; }
    .stats { gap: 9px; margin: 14px 0 8px; }
    .stat { padding: 13px 14px; border-radius: 14px; }
    .stat .v { font-size: 22px; }
    .card { padding: 15px 14px 16px; border-radius: 14px; margin-bottom: 11px; }
    .card h2 { margin-bottom: 13px; }
    .barrow .lb { width: 88px; font-size: 13px; }
    .barrow .n { width: 74px; font-size: 12px; }
    .sub > header { flex-wrap: wrap; padding: 13px 14px; gap: 8px; }
    .who { font-size: 15px; }
    .meta { order: 3; flex-basis: 100%; }
    .badges { margin-left: auto; }
    .sub > .body { padding: 14px 14px 16px; }
    .kv { gap: 8px; font-size: 13px; }
    .kv .k { width: 84px; }
    .media img { width: 96px; height: 96px; border-radius: 10px; }
    .media figcaption { max-width: 96px; }
    .media { gap: 10px; }
    .foot { margin-bottom: 40px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="logo">Q</div>
    <div class="title">
      <span>多模态课堂互动</span>
      <small>教师端 · 直接读任务的接口地址</small>
    </div>
    <div class="tools">
      <span class="dot stale" id="live-dot" title="自动刷新状态"></span>
      <button class="mini" type="button" id="auto-btn">自动刷新</button>
      <button class="mini" type="button" id="refresh-btn">刷新</button>
      <button class="mini" type="button" id="csv-btn">导出 CSV</button>
      <button class="mini" type="button" id="raw-btn">原始 JSON</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="stats">
    <div class="stat"><div class="k">提交数</div><div class="v" id="s-total">–</div></div>
    <div class="stat"><div class="k">平均填写用时</div><div class="v" id="s-time">–<small>秒</small></div></div>
    <div class="stat"><div class="k">平均反应时间</div><div class="v" id="s-rt">–<small>ms</small></div></div>
    <div class="stat"><div class="k">收到的文件</div><div class="v" id="s-files">–</div></div>
  </section>

  <section class="cols">
    <div class="card">
      <h2>跟上程度 <span>单选题分布</span></h2>
      <div id="chart-single"></div>
    </div>
    <div class="card">
      <h2>有帮助的环节 <span>多选题，可重复计数</span></h2>
      <div id="chart-multi"></div>
    </div>
  </section>

  <section class="cols">
    <div class="card">
      <h2>行为数据 <span>表格收不到的那些</span></h2>
      <div class="scroll-x">
        <table class="mini-t" id="behave">
          <thead>
            <tr><th>姓名</th><th>用时</th><th>反应</th><th>看过提示</th><th>排序错误</th><th>点击</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
    <div class="card">
      <h2>班级分布</h2>
      <div id="chart-class"></div>
    </div>
  </section>

  <section class="card">
    <h2>提交明细 <span id="subs-note"></span></h2>
    <div class="subs" id="subs"></div>
  </section>

  <p class="foot">数据来自 <code id="api-url"></code> · 页面每 5 秒自动刷新一次</p>
</main>

<div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="图片预览">
  <button class="lightbox-close" type="button" id="lightbox-close" title="关闭（ESC）">✕</button>
  <img id="lightbox-img" alt="">
  <div class="lightbox-hint">点背景、按 ESC 或右上角 ✕ 关闭</div>
</div>

<script>
(function () {
  "use strict";

  var TASK_ID = "2ejeum6zp9k4";
  var HOME = "https://qform.qiuzizhao.com";
  var HOSTED = /(^|\.)qiuzizhao\.com$/.test(location.hostname);
  var BASE = HOSTED ? "" : HOME;               // 本地打开时补上站点域名
  var API = BASE + "/api/" + TASK_ID + "/all";

  function el(id) { return document.getElementById(id); }
  function on(node, type, fn) { if (node) node.addEventListener(type, fn); }

  var latest = null;
  var auto = true;
  var timer = 0;
  var loading = false;

  el("api-url").textContent = HOME + "/api/" + TASK_ID;

  /* ------------------------------------------------------------ 取数 */

  function load(quiet) {
    if (loading) return Promise.resolve();
    loading = true;
    return fetch(API, { cache: "no-store" })
      .then(function (r) {
        return r.json().then(function (j) {
          return { ok: r.ok, status: r.status, body: j };
        });
      })
      .then(function (res) {
        if (!res.ok) {
          renderError((res.body && res.body.message) || ("HTTP " + res.status));
          return;
        }
        latest = res.body;
        render(latest);
        markLive();
      })
      .catch(function (err) {
        if (!quiet) renderError("读取失败：" + err.message);
        el("live-dot").classList.add("stale");
      })
      .then(function () { loading = false; });
  }

  function markLive() {
    var d = el("live-dot");
    d.classList.remove("stale", "pulse");
    void d.offsetWidth;
    d.classList.add("pulse");
  }

  function renderError(msg) {
    el("subs").innerHTML = "";
    var d = document.createElement("div");
    d.className = "state err";
    d.textContent = msg;
    el("subs").appendChild(d);
  }

  function skeleton() {
    var host = el("subs");
    host.innerHTML = '<div class="skeleton"><div class="sk"></div><div class="sk"></div></div>';
  }

  /* ------------------------------------------------------------ 渲染 */

  function num(v) {
    var n = parseFloat(v);
    return isNaN(n) ? null : n;
  }
  function rows() { return (latest && latest.submissions) || []; }
  function trackOf(row) {
    try { return JSON.parse(row["行为记录"] || "{}"); } catch (e) { return {}; }
  }
  function attachments(row) {
    var a = row.attachment;
    if (!a) return [];
    return Array.isArray(a) ? a : [a];
  }
  function isImg(p) { return /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(p); }
  function isAudio(p) { return /\.(mp3|wav|m4a|webm|ogg)$/i.test(p); }
  function isVideo(p) { return /\.(mp4|mov)$/i.test(p); }
  function avg(list) {
    var v = list.filter(function (x) { return x !== null; });
    if (!v.length) return null;
    return v.reduce(function (a, b) { return a + b; }, 0) / v.length;
  }

  function render(data) {
    var list = data.submissions || [];
    el("subs-note").textContent = "共 " + data.total + " 条，按最新在前";

    var times = list.map(function (r) { return num(trackOf(r)["总用时秒"]); });
    var rts = list.map(function (r) { return num(r["反应时间ms"]); });
    var files = 0;
    list.forEach(function (r) { files += attachments(r).length; });

    el("s-total").textContent = data.total;
    var at = avg(times);
    el("s-time").innerHTML = (at === null ? "–" : at.toFixed(0)) + "<small>秒</small>";
    var ar = avg(rts);
    el("s-rt").innerHTML = (ar === null ? "–" : Math.round(ar)) + "<small>ms</small>";
    el("s-files").textContent = files;

    barChart("chart-single", count(list, "跟上程度"), data.total);
    barChart("chart-class", count(list, "班级"), data.total);
    barChart("chart-multi", countMulti(list, "有帮助的环节"), data.total, true);
    renderBehave(list);
    renderSubs(list);
  }

  function count(list, key) {
    var out = {};
    list.forEach(function (r) {
      var v = (r[key] || "").toString().trim() || "（空）";
      out[v] = (out[v] || 0) + 1;
    });
    return out;
  }
  function countMulti(list, key) {
    var out = {};
    list.forEach(function (r) {
      (r[key] || "").toString().split("/").forEach(function (part) {
        var v = part.trim();
        if (!v) return;
        out[v] = (out[v] || 0) + 1;
      });
    });
    return out;
  }

  function barChart(hostId, map, total, multi) {
    var host = el(hostId);
    host.innerHTML = "";
    var keys = Object.keys(map).sort(function (a, b) { return map[b] - map[a]; });
    if (!keys.length) {
      host.innerHTML = '<div class="empty">还没有数据。</div>';
      return;
    }
    var max = keys.reduce(function (m, k) { return Math.max(m, map[k]); }, 0);
    keys.forEach(function (k) {
      var row = document.createElement("div");
      row.className = "barrow";
      var lb = document.createElement("div");
      lb.className = "lb";
      lb.textContent = k;
      lb.title = k;
      var track = document.createElement("div");
      track.className = "track";
      var fill = document.createElement("i");
      fill.style.width = "0%";
      track.appendChild(fill);
      var n = document.createElement("div");
      n.className = "n";
      n.textContent = multi
        ? map[k] + " 人"
        : map[k] + " 人 · " + Math.round((map[k] / (total || 1)) * 100) + "%";
      row.appendChild(lb);
      row.appendChild(track);
      row.appendChild(n);
      host.appendChild(row);
      requestAnimationFrame(function () {
        fill.style.width = Math.round((map[k] / max) * 100) + "%";
      });
    });
  }

  function renderBehave(list) {
    var tb = el("behave").querySelector("tbody");
    tb.innerHTML = "";
    if (!list.length) {
      tb.innerHTML = '<tr><td colspan="6" class="empty">还没有提交。</td></tr>';
      return;
    }
    list.forEach(function (r) {
      var t = trackOf(r);
      var hints = (t["提示"] || {})["查看次数"];
      var order = t["排序题"] || {};
      var tr = document.createElement("tr");
      [
        r["姓名"] || "（未填）",
        (num(t["总用时秒"]) === null ? "–" : num(t["总用时秒"]).toFixed(0) + "s"),
        (num(r["反应时间ms"]) === null ? "–" : Math.round(num(r["反应时间ms"])) + "ms"),
        (hints === undefined ? "–" : hints + " 次"),
        (order["错误次数"] === undefined ? "–" : order["错误次数"] + " 次"),
        ((t["点击序列"] || []).length) + " 次"
      ].forEach(function (v, i) {
        var td = document.createElement("td");
        td.textContent = v;
        if (i > 0) td.className = "num";
        tr.appendChild(td);
      });
      tb.appendChild(tr);
    });
  }

  function renderSubs(list) {
    var host = el("subs");
    host.innerHTML = "";
    if (!list.length) {
      host.innerHTML = '<div class="state">还没有人提交。打开学生端页面填一份，这里几秒后就会出现。</div>';
      return;
    }
    list.forEach(function (r, idx) {
      var t = trackOf(r);
      var box = document.createElement("article");
      box.className = "sub" + (idx === 0 ? " open" : "");

      var head = document.createElement("header");
      head.setAttribute("role", "button");
      head.setAttribute("tabindex", "0");
      head.setAttribute("aria-expanded", idx === 0 ? "true" : "false");

      var caret = document.createElement("span");
      caret.className = "caret";
      caret.textContent = "▼";
      var who = document.createElement("div");
      who.className = "who";
      who.textContent = r["姓名"] || "（未填姓名）";
      var meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = [r["班级"], r["学号"] ? "学号 " + r["学号"] : "",
        r["_at"]].filter(Boolean).join(" · ");
      var badges = document.createElement("div");
      badges.className = "badges";
      var badge = document.createElement("span");
      badge.className = "badge";
      badge.textContent = "第 " + r["_id"] + " 条";
      var badge2 = document.createElement("span");
      badge2.className = "badge gray";
      badge2.textContent = attachments(r).length + " 个文件";
      badges.appendChild(badge);
      badges.appendChild(badge2);

      head.appendChild(caret);
      head.appendChild(who);
      head.appendChild(meta);
      head.appendChild(badges);

      var body = document.createElement("div");
      body.className = "body";

      var grid = document.createElement("div");
      grid.className = "grid2";
      Object.keys(r).forEach(function (k) {
        if (k === "_id" || k === "_at" || k === "attachment" || k === "行为记录") return;
        if (r[k] === "" || r[k] === null || r[k] === undefined) return;
        var kv = document.createElement("div");
        kv.className = "kv";
        var kk = document.createElement("div");
        kk.className = "k";
        kk.textContent = k;
        var vv = document.createElement("div");
        vv.className = "v";
        vv.textContent = r[k];
        kv.appendChild(kk);
        kv.appendChild(vv);
        grid.appendChild(kv);
      });
      body.appendChild(grid);

      var media = document.createElement("div");
      media.className = "media";
      attachments(r).forEach(function (p) {
        if (isImg(p)) {
          var fig = document.createElement("figure");
          var a = document.createElement("a");
          a.href = BASE + p;
          a.setAttribute("data-lightbox", "");
          a.title = "点击放大";
          var img = document.createElement("img");
          img.src = BASE + p;
          img.alt = p.split("/").pop();
          img.loading = "lazy";
          a.appendChild(img);
          var cap = document.createElement("figcaption");
          cap.textContent = p.split("/").pop();
          fig.appendChild(a);
          fig.appendChild(cap);
          media.appendChild(fig);
        } else if (isAudio(p)) {
          var au = document.createElement("audio");
          au.controls = true;
          au.preload = "none";
          au.src = BASE + p;
          media.appendChild(au);
        } else {
          var line = document.createElement("div");
          line.className = "attachline";
          var link = document.createElement("a");
          link.href = BASE + p;
          link.target = "_blank";
          link.rel = "noopener";
          link.textContent = (isVideo(p) ? "▶ " : "⬇ ") + p.split("/").pop();
          line.appendChild(link);
          media.appendChild(line);
        }
      });
      if (media.children.length) body.appendChild(media);

      var det = document.createElement("details");
      det.className = "raw";
      var sum = document.createElement("summary");
      sum.textContent = "行为记录（点击展开原始 JSON）";
      var pre = document.createElement("pre");
      pre.className = "json";
      pre.textContent = JSON.stringify(t, null, 2);
      det.appendChild(sum);
      det.appendChild(pre);
      body.appendChild(det);

      function toggle() {
        var open = box.classList.toggle("open");
        head.setAttribute("aria-expanded", open ? "true" : "false");
      }
      head.addEventListener("click", toggle);
      head.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
      });

      box.appendChild(head);
      box.appendChild(body);
      host.appendChild(box);
    });
  }

  /* ------------------------------------------------------------ 导出 */

  on(el("csv-btn"), "click", function () {
    var list = rows();
    if (!list.length) return;
    var keys = [];
    list.forEach(function (r) {
      Object.keys(r).forEach(function (k) { if (keys.indexOf(k) < 0) keys.push(k); });
    });
    function cell(v) { return '"' + String(v).replace(/"/g, '""') + '"'; }
    var lines = [keys.map(cell).join(",")];
    list.forEach(function (r) {
      lines.push(keys.map(function (k) {
        var v = r[k];
        if (Array.isArray(v)) v = v.join(" ");
        return cell(v === undefined || v === null ? "" : v);
      }).join(","));
    });
    var blob = new Blob(["\ufeff" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "qform-" + TASK_ID + ".csv";
    a.click();
  });

  on(el("raw-btn"), "click", function () {
    var win = window.open("", "_blank");
    if (!win) return;
    var text = JSON.stringify(latest, null, 2).replace(/[<>&]/g, function (c) {
      return { "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c];
    });
    win.document.write(
      "<title>原始 JSON · " + TASK_ID + "</title>" +
      "<pre style='font:12.5px/1.7 ui-monospace,Consolas,monospace;padding:16px;white-space:pre-wrap'>" +
      text + "</pre>");
  });

  on(el("refresh-btn"), "click", function () {
    var btn = this;
    btn.disabled = true;
    var old = btn.textContent;
    btn.textContent = "刷新中…";
    load().then(function () {
      btn.disabled = false;
      btn.textContent = old;
    });
  });
  on(el("auto-btn"), "click", function () { setAuto(!auto); });

  function setAuto(v) {
    auto = v;
    el("auto-btn").classList.toggle("on", v);
    el("auto-btn").textContent = v ? "自动刷新中" : "已暂停";
    clearInterval(timer);
    if (v) timer = setInterval(function () { load(true); }, 5000);
  }

  /* -------------------------------------------------------- 图片浮层 */

  var lightbox = el("lightbox");
  var lightboxImg = el("lightbox-img");

  function closeLightbox() {
    if (lightbox.hidden) return;
    lightbox.hidden = true;
    lightboxImg.removeAttribute("src");
    document.body.style.overflow = "";
  }

  document.addEventListener("click", function (event) {
    var link = event.target.closest("a[data-lightbox]");
    if (link) {
      event.preventDefault();
      lightboxImg.src = link.getAttribute("href");
      lightbox.hidden = false;
      document.body.style.overflow = "hidden";
      el("lightbox-close").focus();
      return;
    }
    if (!lightbox.hidden &&
        (event.target === lightbox || event.target.closest("#lightbox-close"))) {
      closeLightbox();
    }
  });
  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape") closeLightbox();
  });

  /* 页面切到后台就不再轮询，回来立刻补一次 */
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
      clearInterval(timer);
    } else if (auto) {
      load(true);
      clearInterval(timer);
      timer = setInterval(function () { load(true); }, 5000);
    }
  });

  skeleton();
  setAuto(true);
  load();
})();
</script>
</body>
</html>
