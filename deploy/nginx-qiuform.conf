# QiuForm 的 nginx 站点配置
#
# 放到 /etc/nginx/conf.d/qiuform.conf（或 sites-available 里再软链），
# 然后 nginx -t && systemctl reload nginx。
#
# ⚠️ 这台服务器上已经有别的站点在用（默认站点是 WorkSchedule）。
#    本文件只新增一个 server 块，server_name 写死了 qiuform 子域名，
#    不会影响原有站点。改完务必先 `nginx -t` 再 reload。

# Cloudflare 在前面时会带 X-Forwarded-Proto；
# 直连时没有这个头，就退回连接本身的协议。
map $http_x_forwarded_proto $qf_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen      80;
    listen      [::]:80;
    server_name qiuform.qiuzizhao.com;

    # 上传网页文件 / 接口收附件，都要留足体积
    client_max_body_size 64m;
    client_body_timeout  120s;

    access_log /var/log/nginx/qiuform.access.log;
    error_log  /var/log/nginx/qiuform.error.log;

    location / {
        proxy_pass         http://127.0.0.1:8791;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $qf_proto;
        proxy_set_header X-Forwarded-Host  $host;

        # 导出 CSV / JSON、上传大文件时别被超时打断
        proxy_connect_timeout 15s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # 导出是流式的，缓冲反而占内存
        proxy_buffering off;
    }
}

# ---------------------------------------------------------------------------
# 想让 Cloudflare 用 Full (strict) 而不是 Flexible，就再签一张源站证书：
#   Cloudflare 面板 → SSL/TLS → Origin Server → Create Certificate
#   把证书和私钥放到服务器，例如 /etc/nginx/certs/qiuform.pem / .key
# 然后把上面的 server 块改成：
#
# server {
#     listen 443 ssl;
#     listen [::]:443 ssl;
#     server_name qiuform.qiuzizhao.com;
#
#     ssl_certificate     /etc/nginx/certs/qiuform.pem;
#     ssl_certificate_key /etc/nginx/certs/qiuform.key;
#
#     client_max_body_size 64m;
#     location / {
#         proxy_pass http://127.0.0.1:8791;
#         ...（同上）
#     }
# }
#
# server {
#     listen 80;
#     server_name qiuform.qiuzizhao.com;
#     return 301 https://$host$request_uri;
# }
#
# 同时把 Cloudflare 的 SSL/TLS 模式切到 Full (strict)。
# ---------------------------------------------------------------------------
